[config]
schemaVersion = "0.0.1"

[package]
namespace = "NikkelM"
name = "Discord_Rich_Presence"
versionNumber = "1.0.1"
description = "Adds detailed Discord Rich Presence status messages and icons for Hades II, with compatibility for Dream Dives, Chaos Trials, and the Zagreus' Journey and Dream Dive Tweaks mods."
websiteUrl = "https://github.com/NikkelM/Hades-II-DiscordRichPresence"
containsNsfwContent = false

[package.dependencies]
Hell2Modding-Hell2Modding = "1.0.124"
LuaENVY-ENVY = "1.2.0"
SGG_Modding-Chalk = "2.1.2"
SGG_Modding-ReLoad = "1.0.3"
SGG_Modding-ModUtil = "4.0.1"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./CHANGELOG.md"
target = "./CHANGELOG.md"

[[build.copy]]
source = "./LICENSE"
target = "./LICENSE"

[[build.copy]]
source = "./src/main.lua"
target = "./plugins/main.lua"

[[build.copy]]
source = "./src/config.lua"
target = "./plugins/config.lua"

[[build.copy]]
source = "./src/Scripts"
target = "./plugins/Scripts"

[publish]
repository = "https://thunderstore.io"
communities = ["hades-ii"]

[publish.categories]
hades-ii = ["mods", "ai-generated"]
